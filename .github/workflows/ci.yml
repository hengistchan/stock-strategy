name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[web,test]'
        working-directory: backend
      - run: python scripts/acceptance.py
        working-directory: backend

  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[web,test]'
        working-directory: backend
      - run: ruff check stock_strategy tests scripts
        working-directory: backend
      - run: ruff format --check stock_strategy tests scripts
        working-directory: backend
      - run: mypy stock_strategy
        working-directory: backend
      - run: coverage run -m unittest discover -s tests
        working-directory: backend
      - run: coverage report
        working-directory: backend
      - run: bandit -q -r stock_strategy -c pyproject.toml
        working-directory: backend
      - run: python -m pip_audit --local --skip-editable
        working-directory: backend

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
        working-directory: frontend
      - run: python -m pip install -e './backend[web]'
      - run: make api-schema-check PYTHON=python
      - run: npm run build
        working-directory: frontend
      - run: python -m pip install build
      - run: rm -rf backend/build backend/dist backend/*.egg-info
      - run: python -m build --wheel backend
      - name: Verify wheel contains the production frontend
        run: python backend/scripts/verify_wheel.py
